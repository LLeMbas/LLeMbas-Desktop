<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark light">
<title>LLeMbas</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="titlebar.css">
<script src="titlebar.js" defer></script>
</head>
<body>
<header class="bar" data-tauri-drag-region>
  <img class="bar__leaf" src="logo-mark.svg" alt="" width="18" height="18" data-tauri-drag-region>
  <span class="bar__name" data-tauri-drag-region><b>LL</b>e<b>M</b>bas</span>
  <span class="bar__host" id="host" data-tauri-drag-region></span>

  <button class="bar__agent" id="agent" type="button" title="Agent">
    <span class="dot" aria-hidden="true"></span><span id="agent-text">agent off</span>
  </button>
  <button class="bar__btn" id="menu" type="button" aria-label="Menu" title="Menu">
    <svg viewBox="0 0 16 16" aria-hidden="true"><g fill="currentColor"><rect x="3" y="4" width="10" height="1.5"/><rect x="3" y="7.25" width="10" height="1.5"/><rect x="3" y="10.5" width="10" height="1.5"/></g></svg>
  </button>
  <span class="bar__sep" aria-hidden="true"></span>
  <button class="bar__btn" id="minimize" type="button" aria-label="Minimise" title="Minimise">
    <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="10" width="8" height="1.5" fill="currentColor"/></svg>
  </button>
  <button class="bar__btn" id="maximize" type="button" aria-label="Maximise" title="Maximise">
    <svg class="i-max" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.75 4.75h6.5v6.5h-6.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    <svg class="i-restore" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.75 6.25h6v6h-6z M6.25 6.25v-2.5h6v6h-2.5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
  <button class="bar__btn bar__btn--close" id="close" type="button" aria-label="Close" title="Close (LLeMbas stays in the tray)">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7" stroke="currentColor" stroke-width="1.5"/></svg>
  </button>
</header>
</body>
</html>
